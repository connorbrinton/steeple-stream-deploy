name: Propose application updates

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: propose-steeple-stream-update
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Check application revision
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current=$(jq -r '.nodes[.nodes.root.inputs["steeple-stream"]].locked.rev' flake.lock)
          latest=$(gh api repos/connorbrinton/steeple-stream/commits/main --jq .sha)
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          if [[ "$current" != "$latest" ]]; then
            echo 'update=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Update only the application flake input
        if: steps.revision.outputs.update == 'true'
        run: |
          set -euo pipefail
          nix flake update steeple-stream
          git diff --check
          test "$(jq -r '.nodes[.nodes.root.inputs["steeple-stream"]].locked.rev' flake.lock)" = "${{ steps.revision.outputs.latest }}"
          # Do not accidentally include unrelated changes in a production PR.
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = 'flake.lock'
      - name: Create or refresh deployment PR
        if: steps.revision.outputs.update == 'true'
        id: proposal
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          add-paths: flake.lock
          branch: automation/update-steeple-stream
          delete-branch: true
          commit-message: "Update Steeple Stream application pin"
          title: "Update Steeple Stream application pin"
          body: |
            Generated by the deployment repository's application-update workflow.

            - Currently deployed application input: ${{ steps.revision.outputs.current }}
            - Proposed application revision: ${{ steps.revision.outputs.latest }}
            - Scope: flake.lock only (including any application-owned transitive inputs)

            Review the application changes and the Nix Check result before merging.
            Merging deployment main causes comin to activate the new NixOS generation.
            This workflow never merges or deploys changes automatically.
      # GITHUB_TOKEN-authored PRs do not reliably start regular pull_request CI.
      # workflow_dispatch is exempt from that suppression and runs against the PR head.
      - name: Start Nix validation for bot-authored PR
        if: steps.proposal.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.proposal.outputs.pull-request-branch }}
        run: gh workflow run nix-check.yml --ref "$BRANCH"
