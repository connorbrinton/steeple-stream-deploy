name: Update Steeple Stream input (temporary)
on:
  push:
    branches:
      - deploy/offline-broadcaster-pr43

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deploy/offline-broadcaster-pr43
          persist-credentials: true
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Update only Steeple Stream flake input
        run: nix flake update steeple-stream
      - name: Confirm app is pinned to patched Node.js 22.23.4 or newer
        run: |
          node_version=$(nix eval --raw --impure --expr 'let f = builtins.getFlake (toString ./.); pkgs = import f.inputs.steeple-stream.inputs.nixpkgs { system = "x86_64-linux"; }; in pkgs.nodejs_22.version')
          echo "Node runtime: $node_version"
          if [[ "$node_version" != "22.23.4" ]]; then
            echo "Unexpected Node.js version, please verify before deploying"
            exit 1
          fi
      - name: Commit changed lockfile
        run: |
          if ! git diff --quiet -- flake.lock; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add flake.lock
            git commit -m 'deploy: pin Steeple Stream offline broadcaster (PR #43)'
            git push origin HEAD:deploy/offline-broadcaster-pr43
          fi
