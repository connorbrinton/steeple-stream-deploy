name: Update Steeple Stream input (temporary)
on:
  push:
    branches: [deploy/offline-diagnostics-pr45]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deploy/offline-diagnostics-pr45
          persist-credentials: true
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Update application flake input
        run: nix flake update steeple-stream
      - name: Validate pinned revision
        run: |
          test "$(jq -r '.nodes["steeple-stream"].locked.rev' flake.lock)" = "8d456f15600d19444db28ac6e67bbb2d1fcfc2cf"
      - name: Commit lockfile
        run: |
          if ! git diff --quiet -- flake.lock; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add flake.lock
            git commit -m 'deploy: pin offline readiness and diagnostics PR #45'
            git push origin HEAD:deploy/offline-diagnostics-pr45
          fi
