name: Refresh Steeple Stream application input
on:
  push:
    branches: [deploy-lan-webrtc-transport-indicator-oct11]
    paths:
      - .github/workflows/refresh-app-input-oct11.yml
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Update application input
        run: nix flake update steeple-stream
      - name: Commit refreshed flake lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          git diff --cached --quiet || (git commit -m "Pin merged LAN WebRTC and camera changes" && git push)
