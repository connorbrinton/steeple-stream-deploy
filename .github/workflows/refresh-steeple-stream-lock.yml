name: Refresh Steeple Stream lock
on:
  push:
    branches: [deploy-steeple-stream-pr-36]
    paths:
      - .github/workflows/refresh-steeple-stream-lock.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Update application lock only
        run: nix flake update steeple-stream
      - name: Commit refreshed lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          git diff --cached --quiet || (git commit -m "Regenerate Steeple Stream flake lock" && git push)
