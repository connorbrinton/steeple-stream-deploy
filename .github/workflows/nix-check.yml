name: Nix Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lock:
    name: Generate Steeple Stream Nix hash
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Emit updated flake.lock
        run: |
          nix flake lock --update-input steeple-stream
          echo 'STEEPLE_LOCK_BEGIN'
          cat flake.lock
          echo 'STEEPLE_LOCK_END'
