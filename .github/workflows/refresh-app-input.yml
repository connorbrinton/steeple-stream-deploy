name: Refresh Steeple Stream input
on:
  push:
    branches: [deploy-preview-edges-pr-38]
    paths:
      - .github/workflows/refresh-app-input.yml
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - run: nix flake update steeple-stream
      - name: Commit updated lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          git diff --cached --quiet || (git commit -m "Update Steeple Stream for PR #38" && git push)
